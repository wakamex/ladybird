<!DOCTYPE html>
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/2328">
<script src="../include.js"></script>
<style>
    .container {
        width: 500px;
    }
    .box {
        width: 100px;
        height: 10px;
    }
</style>
<div class="container">
    <div class="box" id="zero-margins" style="margin: 0"></div>
    <div class="box" id="length-margins" style="margin-left: 20px; margin-right: 30px"></div>
    <div class="box" id="font-relative-margins" style="font-size: 10px; margin-left: 2em; margin-right: 3em"></div>
    <div class="box" id="wider-than-container" style="width: 600px; margin-left: 20px; margin-right: 30px"></div>
    <div class="box" id="auto-margin-left" style="margin-left: auto; margin-right: 30px"></div>
    <div class="box" id="auto-margin-right" style="margin-left: 20px; margin-right: auto"></div>
    <div class="box" id="auto-margins" style="margin-left: auto; margin-right: auto"></div>
</div>
<div class="container" style="direction: rtl">
    <div class="box" id="rtl-length-margins" style="margin-left: 20px; margin-right: 30px"></div>
</div>
<script>
    test(() => {
        for (const box of document.querySelectorAll(".box")) {
            const style = getComputedStyle(box);
            println(`${box.id}: margin-left=${style.marginLeft} margin-right=${style.marginRight}`);
        }
    });
</script>
